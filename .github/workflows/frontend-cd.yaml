name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: frontend

jobs:
  # lint and test declare no `needs`, so GitHub schedules them in parallel.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.14
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.14
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build-and-deploy:
    name: Build and Deploy
    # Gate: only runs when BOTH lint and test succeed.
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Credentials come only from GitHub Secrets. Nothing is hardcoded.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kustomize
        run: |
          set -eo pipefail
          if ! command -v kustomize >/dev/null 2>&1; then
            curl -sSLo kustomize.tar.gz \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
            tar -xzf kustomize.tar.gz
            sudo mv kustomize /usr/local/bin/kustomize
            rm -f kustomize.tar.gz
          fi
          kustomize version

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      # React bakes REACT_APP_MOVIE_API_URL into the bundle at build time, so the
      # backend LoadBalancer must be resolved BEFORE `docker build` runs.
      - name: Resolve backend LoadBalancer URL
        id: backend-url
        run: |
          set -eo pipefail
          BACKEND_HOST=""
          for i in $(seq 1 30); do
            BACKEND_HOST=$(kubectl get svc backend -n default \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$BACKEND_HOST" ]; then
              BACKEND_HOST=$(kubectl get svc backend -n default \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$BACKEND_HOST" ]; then
              break
            fi
            echo "Waiting for backend LoadBalancer to be provisioned... ($i/30)"
            sleep 10
          done
          if [ -z "$BACKEND_HOST" ]; then
            echo "::warning::backend LoadBalancer not available; falling back to http://localhost:5000"
            BACKEND_URL="http://localhost:5000"
          else
            # The backend Service listens on port 80 -> targetPort 5000.
            BACKEND_URL="http://${BACKEND_HOST}"
          fi
          echo "Resolved backend URL: ${BACKEND_URL}"
          echo "url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image tagged with the git SHA
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKEND_URL: ${{ steps.backend-url.outputs.url }}
        run: |
          set -eo pipefail
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL=${BACKEND_URL} \
            --tag=${ECR_REGISTRY}/frontend:${{ github.sha }} \
            starter/frontend

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eo pipefail
          docker push ${ECR_REGISTRY}/frontend:${{ github.sha }}

      - name: Deploy to EKS with kustomize
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: starter/frontend/k8s
        run: |
          set -eo pipefail
          kustomize edit set image frontend=${ECR_REGISTRY}/frontend:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: |
          set -eo pipefail
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl get svc frontend

      # `kustomize edit` rewrites kustomization.yaml in the runner workspace.
      # Nothing is ever committed from CI, but restore it explicitly so the
      # mutation cannot leak into any later step or artifact.
      - name: Restore kustomization.yaml
        if: always()
        run: git checkout -- starter/frontend/k8s/kustomization.yaml || true
