name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: backend

jobs:
  # lint and test declare no `needs`, so GitHub schedules them in parallel.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install pipenv
        run: pip install pipenv flake8

      # --dev is required: flake8 lives in [dev-packages].
      - name: Install dependencies
        run: pipenv install --dev

      - name: Run flake8
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install pipenv
        run: pip install pipenv flake8

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run pytest
        run: pipenv run test

  build-and-deploy:
    name: Build and Deploy
    # Gate: only runs when BOTH lint and test succeed.
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Credentials come only from GitHub Secrets. Nothing is hardcoded.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kustomize
        run: |
          set -eo pipefail
          if ! command -v kustomize >/dev/null 2>&1; then
            curl -sSLo kustomize.tar.gz \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
            tar -xzf kustomize.tar.gz
            sudo mv kustomize /usr/local/bin/kustomize
            rm -f kustomize.tar.gz
          fi
          kustomize version

      - name: Build Docker image tagged with the git SHA
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eo pipefail
          docker build \
            --tag=${ECR_REGISTRY}/backend:${{ github.sha }} \
            starter/backend

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eo pipefail
          docker push ${ECR_REGISTRY}/backend:${{ github.sha }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Deploy to EKS with kustomize
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: starter/backend/k8s
        run: |
          set -eo pipefail
          kustomize edit set image backend=${ECR_REGISTRY}/backend:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: |
          set -eo pipefail
          kubectl rollout status deployment/backend --timeout=120s
          kubectl get svc backend

      # `kustomize edit` rewrites kustomization.yaml in the runner workspace.
      - name: Restore kustomization.yaml
        if: always()
        run: git checkout -- starter/backend/k8s/kustomization.yaml || true
